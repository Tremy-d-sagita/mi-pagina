<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            padding: 50px 20px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        .counter-box {
            margin-top: 30px;
            padding: 15px;
            background: #eef2f3;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Bienvenidos a mi página!</h1>
        <p>Gracias por visitar mi sitio web.</p>

        <div class="counter-box">
            <p><strong>Contador de visitas:</strong></p>
            <!-- Contador automático -->
            <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fgithub.com%2Ftu-usuario%2Fmi-pagina&count_bg=%232563EB&title=Visitas" alt="Contador de visitas"/>
        </div>
    </div>

</body>
</html>
